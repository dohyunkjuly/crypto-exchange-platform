[project]
name = "exchange-bots"
version = "0.1.0"
description = "Trading bots for the exchange: a client for it and one for a reference feed, and the controllers that use them"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

# One entry point per controller, so each runs, restarts and crashes on its own.
[project.scripts]
bots = "bots.cli_main:main"
bots-trade-replay = "bots.trade_replay_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bots"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, comprehensions, pyupgrade. No linter here catches
# the mistake that matters most -- a float where money is meant -- so tests do it instead.
select = ["E", "F", "I", "B", "C4", "UP"]
