# The benchmarks' overlay: three Kafka brokers instead of one, for the performance report's second column
# ("three brokers, acks=all") and the broker-loss scenario, which kills one and shows nothing is
# lost. A test fixture, not a deployment file -- a deployment runs a managed Kafka or its own
# cluster, and the apps need only KAFKA_BOOTSTRAP_SERVERS and KAFKA_REPLICATION_FACTOR=3
# (docs/reference/deployment.md).
#
#   docker compose -f docker-compose.yml -f docker-compose.perf.yml --profile full up -d
#   PERF_TOPOLOGY=cluster ./gradlew perf
#
# An overlay on docker-compose.yml, so the single-broker file stays the laptop default: three
# brokers are three JVMs. Every topic is created with replication 3 and min.insync.replicas 2
# (libs/common Replication), and the apps' acks=all then means what it says. The command log on
# a single-broker volume was formatted with another cluster id, so switching between the two is
# a `down -v` first, not an `up`.

x-broker: &broker
  image: apache/kafka:3.9.0
  environment: &broker-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    # The same id on all three, or each formats its own one-node cluster.
    CLUSTER_ID: exchange-local-cluster-0001
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    KAFKA_LOG_DIRS: /var/lib/kafka/data
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 10

services:
  kafka:
    <<: *broker
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092

  kafka-2:
    <<: *broker
    container_name: exchange-kafka-2
    ports:
      - "9094:9094"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:9094,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9094,INTERNAL://kafka-2:29092
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9094 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    <<: *broker
    container_name: exchange-kafka-3
    ports:
      - "9095:9095"
    environment:
      <<: *broker-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:9095,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9095,INTERNAL://kafka-3:29092
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9095 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  # The one-shot waits for the whole quorum and creates the command topic replicated.
  kafka-topics:
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    command: ["--bootstrap-server", "kafka:29092", "--create", "--if-not-exists",
              "--topic", "exchange.spot.commands.v1", "--partitions", "8", "--replication-factor", "3",
              "--config", "retention.ms=-1", "--config", "min.insync.replicas=2"]

  # Every app that creates a topic creates it replicated. Bootstrap stays `kafka:29092`: the
  # first broker answers with all three.
  spot-matching-engine:
    environment:
      KAFKA_REPLICATION_FACTOR: 3
    depends_on:
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
  spot-settlement:
    environment:
      KAFKA_REPLICATION_FACTOR: 3
  market-data:
    environment:
      KAFKA_REPLICATION_FACTOR: 3
  spot-copy:
    environment:
      KAFKA_REPLICATION_FACTOR: 3
  spot-open-api:
    environment:
      KAFKA_REPLICATION_FACTOR: 3
  web-bff:
    environment:
      KAFKA_REPLICATION_FACTOR: 3

volumes:
  kafka-2-data:
  kafka-3-data:
