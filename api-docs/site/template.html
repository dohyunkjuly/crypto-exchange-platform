<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html"><img src="logo.svg" alt="{{name}}"></a>
    <nav class="nav">
      <a class="nav-link{{nav-api}}" href="index.html">API</a>
      <a class="nav-link{{nav-log}}" href="log.html">Change Log</a>
    </nav>
  </header>

  <button type="button" class="nav-tab" id="nav-tab" aria-label="Navigation">NAV
    <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2 2v8M6 2v8M10 2v8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
  </button>
  <div class="backdrop" id="backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <label class="search">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="search" type="search" placeholder="Search" autocomplete="off">
    </label>
    <ul class="toc" id="toc">{{sidebar}}</ul>
  </aside>

  <div class="tabs{{tabs-class}}" id="tabs">{{tabs}}</div>

  <main class="page">
    <article class="content" id="content">
{{content}}
    </article>
  </main>

  <script id="search-index" type="application/json">{{index}}</script>
  <script src="app.js"></script>
</body>
</html>
