# Who may reach admin.<domain> at all. Private ranges only, which is every address a laptop,
# an office or a VPN presents and none the public internet does. In production replace these
# with the office and VPN egress addresses. Order matters: the first match wins, so `deny all`
# stays last.
allow 127.0.0.0/8;
allow 10.0.0.0/8;
allow 172.16.0.0/12;
allow 192.168.0.0/16;
allow ::1;
deny  all;
